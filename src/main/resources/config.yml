    Sound:
      Name: entity.villager.no
      Volume: 2.0
      Pitch: 1.0
  highfive:
    Sender: '<prefix> <gray>You give a mighty highfive to <green><bold><target><reset><gray>.'
    Target: '<prefix> <green><bold><sender> <reset><gray>gives you a mighty highfive.'
