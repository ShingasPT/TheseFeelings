Prefix: "<dark_gray>[</dark_gray><yellow>TheseFeelings<dark_gray>]</dark_gray>"
Cooldown: 15 #Seconds
CooldownMsg: '<prefix> <gray>You can run this command in <yellow><time> <gray>seconds.'
Feelings:
  hug:
    Sender: '<prefix> <gray>You give <green><bold><target> <reset><gray>a warm hug. <red>Awww <dark_red>❤'
    Target: '<prefix> <green><bold><sender> <reset><gray>gives you a warm hug. <red>Awww <dark_red>❤'
    Sound:
      Name: entity.cat.purreow
      Volume: 2.0
      Pitch: 2.0
  bite:
    Sender: '<prefix> <gray>You sink your teeth into <red><bold><target><reset><gray>''s skin.'
    Target: '<prefix> <red><bold><sender> <reset><gray>sinks their teeth into your skin.'
    Sound:
      Name: entity.zombie.attack_wooden_door
      Volume: 2.0
      Pitch: 2.0
  murder:
    Sender: '<prefix> <gray>You murder <red><bold><target> <reset><gray>and have no regrets.'
    Target: '<prefix> <red><bold><sender> <reset><gray>just murdered you. Call an ambulance?'
    Sound:
      Name: entity.blaze.death
      Volume: 1.0
      Pitch: 0.7
  dab:
    Sender: '<prefix> <gray>You freshly dab on <green><bold><target><reset><gray>... <gray><italic>Got''em.'
